
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PANIHOLUB TERMINAL</title>


<style>
   /* ===== ФОН ===== */

        body {
            margin: 0;
            background: #080008;
            color: #d9a7ff;
            font-family: "Courier New", monospace;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background: url("images/backgraund3.png") center / cover no-repeat;

            z-index: 0;
            pointer-events: none;
        }

        /* ===== ГОЛОВНИЙ КОНТЕЙНЕР ===== */

        .site {
            position: relative;
            z-index: 1;

            width: 1000px;
            max-width: 94%;

            margin: 30px auto;
        }

    * {
    box-sizing: border-box;
}

.terminal {
    max-width: 850px;
    margin: 40px auto;
    background: #000;
    border: 2px solid #00aa00;
    padding: 20px;
    min-height: 500px;
    box-shadow: 0 0 15px #003300;
}

.header {
    border-bottom: 1px solid #008800;
    padding-bottom: 12px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    color: #00ff00;
    text-shadow: 0 0 5px #00ff00;
}

#output {
    white-space: pre-wrap;
    line-height: 1.6;
    overflow-wrap: anywhere;
    text-shadow: 0 0 4px #00ff00;
}

.input-line {
    display: flex;
    margin-top: 15px;
    gap: 10px;
}

.prompt {
    white-space: nowrap;
    text-shadow: 0 0 5px #00ff00;
}

input {
    background: transparent;
    border: none;
    outline: none;
    color: #00ff00;
    font: inherit;
    width: 100%;
    caret-color: #00ff00;
}

input::placeholder {
    color: #006600;
}

/* CRT EFFECT */

.terminal {
    position: relative;
}

.terminal::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
        transparent 0px,
        rgba(0,255,0,0.025) 1px,
        transparent 2px,
        transparent 4px
    );
}

a {
    color: #00ff00;
}
</style>

</head>

<body>

<div class="terminal">

    <div class="header">
        <b>PANIHOLUB TERMINAL v1.0</b>
        <span>● ONLINE</span>
    </div>

    <div id="output">WELCOME TO THE VOID...

TYPE 'help' TO SEE AVAILABLE COMMANDS.

</div>

    <div class="input-line">
        <span class="prompt">visitor@paniholub:~$</span>
        <input id="command" autofocus
        autocomplete="off"
        placeholder="enter command...">
    </div>

</div>

<script>
const output = document.getElementById("output");
const input = document.getElementById("command");

function print(text) {
    output.textContent += text + "\n";
}

function execute(cmd) {
    const command = cmd.trim().toLowerCase();

    print("visitor@paniholub:~$ " + cmd);

    switch(command) {

        case "help":
            print(`
AVAILABLE COMMANDS:

help     - show commands
about    - about this website
music    - music section
date     - current date
clear    - clear terminal
secret   - secret message
hello    - say hello
whoami   - who are you?
`);
            break;

        case "about":
            print("PANIHOLUB - PERSONAL WEBSITE.");
            print("WELCOME TO MY LITTLE CORNER OF INTERNET.");
            break;

        case "music":
            print("GO TO THE MUSIC SECTION TO DISCOVER SOMETHING.");
            break;

        case "date":
            print(new Date().toString());
            break;

        case "hello":
            print("HELLO, STRANGER. WELCOME HERE.");
            break;

        case "whoami":
            print("YOU ARE JUST ANOTHER VISITOR...");
            break;

        case "secret":
            print("YOU FOUND NOTHING. OR MAYBE YOU DID?");
            break;

        case "clear":
            output.textContent = "";
            return;

        case "":
            return;

        default:
            print("UNKNOWN COMMAND: " + command);
            print("TYPE 'help' FOR HELP.");
    }

    print("");
}

input.addEventListener("keydown", function(e) {
    if(e.key === "Enter") {
        const cmd = input.value;
        input.value = "";
        execute(cmd);
    }
});
</script>

</body>
</html>
