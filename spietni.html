<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>СПЛЄТНІ</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --black: #080808;
            --dark: #111;
            --dark2: #171717;
            --red: #d00000;
            --red2: #ff1717;
            --red-dark: #650000;
            --text: #eeeeee;
            --gray: #777;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 30px 15px;

            background:
                radial-gradient(
                    circle at top,
                    #260000 0%,
                    #0b0000 25%,
                    #080808 60%
                );

            color: var(--text);

            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 850px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        h1 {
            margin: 0;

            color: white;

            font-size: clamp(32px, 8vw, 65px);

            letter-spacing: 8px;

            text-shadow:
                0 0 5px white,
                0 0 15px var(--red),
                0 0 35px var(--red);

            cursor: pointer;

            transition: 0.2s;
        }

        h1:hover {
            text-shadow:
                0 0 8px white,
                0 0 25px var(--red2),
                0 0 60px var(--red2);
        }

        .subtitle {
            margin-top: 8px;

            color: #777;

            font-size: 12px;

            letter-spacing: 4px;

            text-transform: uppercase;
        }

        /* =========================
           ФОРМА
        ========================= */

        .form {
            position: relative;

            padding: 22px;

            margin-bottom: 30px;

            background:
                linear-gradient(
                    145deg,
                    #171717,
                    #0c0c0c
                );

            border: 1px solid #3b0000;

            border-radius: 12px;

            box-shadow:
                0 0 25px rgba(180, 0, 0, 0.12);

            transition: 0.2s;
        }

        .form::before {
            content: "";

            position: absolute;

            top: 0;
            bottom: 0;
            left: 0;

            width: 3px;

            background: var(--red);

            box-shadow:
                0 0 12px var(--red);

            border-radius: 12px 0 0 12px;
        }

        .form:hover {
            border-color: #650000;

            box-shadow:
                0 0 35px rgba(220, 0, 0, 0.18);
        }

        input,
        textarea {
            width: 100%;

            margin-bottom: 13px;

            padding: 13px 14px;

            border: 1px solid #333;

            border-radius: 7px;

            outline: none;

            background: #090909;

            color: #eee;

            font-family: inherit;

            font-size: 15px;

            transition: 0.2s;
        }

        input::placeholder,
        textarea::placeholder {
            color: #555;
        }

        input:focus,
        textarea:focus {
            border-color: var(--red);

            background: #100000;

            box-shadow:
                0 0 8px rgba(255, 0, 0, 0.35),
                inset 0 0 10px rgba(255, 0, 0, 0.06);
        }

        textarea {
            min-height: 130px;

            resize: vertical;
        }

        .file-label {
            display: block;

            margin-bottom: 10px;

            color: #999;

            font-size: 13px;
        }

        input[type="file"] {
            cursor: pointer;

            padding: 10px;

            color: #999;
        }

        input[type="file"]::file-selector-button {
            padding: 8px 12px;

            margin-right: 10px;

            border: 1px solid #650000;

            border-radius: 6px;

            background: #170000;

            color: #eee;

            cursor: pointer;

            transition: 0.2s;
        }

        input[type="file"]::file-selector-button:hover {
            background: var(--red);

            box-shadow:
                0 0 15px var(--red);
        }

        /* =========================
           PREVIEW
        ========================= */

        #preview {
            display: none;

            margin: 15px 0;

            padding: 10px;

            border: 1px solid #3b0000;

            border-radius: 8px;

            background: #090909;
        }

        #preview img,
        #preview video {
            display: block;

            width: 100%;

            max-height: 450px;

            object-fit: contain;

            border-radius: 6px;

            background: #050505;

            box-shadow:
                0 0 20px rgba(200, 0, 0, 0.2);
        }

        .preview-name {
            margin-bottom: 8px;

            color: #888;

            font-size: 12px;

            word-break: break-all;
        }

        /* =========================
           КНОПКА
        ========================= */

        #submitBtn {
            width: 100%;

            padding: 14px;

            border: 1px solid var(--red);

            border-radius: 7px;

            background:
                linear-gradient(
                    90deg,
                    #700000,
                    #c00000,
                    #700000
                );

            color: white;

            font-weight: bold;

            font-size: 15px;

            letter-spacing: 2px;

            cursor: pointer;

            text-transform: uppercase;

            transition: 0.15s;
        }

        #submitBtn:hover {
            background:
                linear-gradient(
                    90deg,
                    #a00000,
                    #ff1111,
                    #a00000
                );

            box-shadow:
                0 0 20px rgba(255, 0, 0, 0.55);
        }

        #submitBtn:active {
            transform: scale(0.98);

            box-shadow:
                0 0 35px red;
        }

        #submitBtn:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }

        /* =========================
           STATUS
        ========================= */

        #status {
            min-height: 20px;

            margin-top: 12px;

            text-align: center;

            color: #999;

            font-size: 13px;
        }

        .error {
            color: #ff3333 !important;

            text-shadow:
                0 0 8px red;
        }

        .success {
            color: #ff5555 !important;

            text-shadow:
                0 0 10px red;
        }

        /* =========================
           POSTS
        ========================= */

        #posts {
            display: flex;

            flex-direction: column;

            gap: 15px;
        }

        .post {
            position: relative;

            padding: 18px;

            background:
                linear-gradient(
                    145deg,
                    #171717,
                    #0c0c0c
                );

            border: 1px solid #292929;

            border-radius: 10px;

            transition:
                border-color 0.2s,
                box-shadow 0.2s,
                transform 0.2s;
        }

        .post::before {
            content: "";

            position: absolute;

            top: 12px;
            bottom: 12px;
            left: 0;

            width: 2px;

            background: #400000;

            transition: 0.2s;
        }

        .post:hover {
            border-color: #550000;

            box-shadow:
                0 0 20px rgba(180, 0, 0, 0.12);

            transform: translateY(-1px);
        }

        .post.flash {
            border-color: var(--red2);

            box-shadow:
                0 0 10px var(--red),
                0 0 35px rgba(255, 0, 0, 0.4);

            animation: flashPost 0.45s ease;
        }

        .post.flash::before {
            background: var(--red2);

            box-shadow:
                0 0 15px var(--red2);
        }

        @keyframes flashPost {
            0% {
                box-shadow:
                    0 0 0 rgba(255, 0, 0, 0);
            }

            40% {
                box-shadow:
                    0 0 35px rgba(255, 0, 0, 0.8);
            }

            100% {
                box-shadow:
                    0 0 10px rgba(255, 0, 0, 0.15);
            }
        }

        .post-header {
            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 15px;

            margin-bottom: 12px;
        }

        .nickname {
            color: white;

            font-size: 16px;

            font-weight: bold;

            text-shadow:
                0 0 8px rgba(255, 0, 0, 0.4);
        }

        .nickname::before {
            content: "@";

            color: var(--red);

            margin-right: 2px;
        }

        .date {
            color: #555;

            font-size: 11px;

            white-space: nowrap;
        }

        .message {
            color: #ddd;

            line-height: 1.55;

            white-space: pre-wrap;

            word-break: break-word;
        }

        /* =========================
           MEDIA
        ========================= */

        .media {
            margin-top: 15px;
        }

        .media img,
        .media video {
            display: block;

            width: 100%;

            max-height: 600px;

            object-fit: contain;

            border-radius: 7px;

            background: #050505;

            border: 1px solid #300000;

            transition: 0.2s;
        }

        .media img:hover,
        .media video:hover {
            border-color: var(--red);

            box-shadow:
                0 0 20px rgba(255, 0, 0, 0.3);
        }

        /* =========================
           DELETE
        ========================= */

        .delete-btn {
            margin-top: 15px;

            padding: 7px 11px;

            border: 1px solid #3d0000;

            border-radius: 5px;

            background: transparent;

            color: #777;

            font-size: 11px;

            cursor: pointer;

            transition: 0.2s;
        }

        .delete-btn:hover {
            color: white;

            border-color: var(--red);

            background: #250000;

            box-shadow:
                0 0 12px rgba(255, 0, 0, 0.35);
        }

        .loading {
            padding: 30px;

            text-align: center;

            color: #555;

            letter-spacing: 2px;
        }

        .empty {
            padding: 40px;

            text-align: center;

            color: #444;

            border: 1px dashed #300000;

            border-radius: 10px;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }

            .form,
            .post {
                padding: 15px;
            }

            .post-header {
                flex-direction: column;

                gap: 5px;
            }

            .date {
                white-space: normal;
            }

            h1 {
                letter-spacing: 4px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1 id="title">СПЛЄТНІ</h1>

        <div class="subtitle">
            ну давай розказуй, шо там вже цікавенького XP
        </div>
    </header>

    <div class="form">

        <input
            id="nickname"
            type="text"
            maxlength="40"
            placeholder="Хто ти, блііін..."
            autocomplete="off"
        >

        <textarea
            id="message"
            maxlength="5000"
            placeholder="Пиши сюди..."
        ></textarea>

        <label class="file-label">
            Додати фото, GIF або відео
        </label>

        <input
            id="media"
            type="file"
            accept="image/*,video/*"
        >

        <div id="preview"></div>

        <button id="submitBtn">
            Опублікувати
        </button>

        <div id="status"></div>

    </div>

    <div id="posts">

        <div class="loading">
            Ща..ща всьо будєт...
        </div>

    </div>

</div>

<script>

const SUPABASE_URL =
    "https://sijjjlnhfmbmvswphxhz.supabase.co";

const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpampqbG5oZm1ibXZzd3BoeGh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNDk2OTEsImV4cCI6MjEwMjYyNTY5MX0.eyU6n6C6iA8Lxhmj_qktcAbAvfm5cvbm-_3_EoO4RPI";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   ELEMENTS
========================= */

const nicknameInput =
    document.getElementById("nickname");

const messageInput =
    document.getElementById("message");

const mediaInput =
    document.getElementById("media");

const preview =
    document.getElementById("preview");

const submitBtn =
    document.getElementById("submitBtn");

const status =
    document.getElementById("status");

const postsContainer =
    document.getElementById("posts");

const title =
    document.getElementById("title");


/* =========================
   STATUS
========================= */

function showStatus(text, error = false) {

    status.textContent = text;

    status.className =
        error ? "error" : "success";
}


/* =========================
   FILE PREVIEW
========================= */

mediaInput.addEventListener(
    "change",
    function () {

        const file =
            mediaInput.files[0];

        preview.innerHTML = "";

        preview.style.display = "none";

        if (!file) {
            return;
        }

        const maxSize =
            1500 * 1024 * 1024;

        if (file.size > maxSize) {

            showStatus(
                "Максимальний розмір файлу — 1500 MB.",
                true
            );

            mediaInput.value = "";

            return;
        }

        if (
            !file.type.startsWith("image/") &&
            !file.type.startsWith("video/")
        ) {

            showStatus(
                "Можна завантажувати тільки фото, GIF або відео.",
                true
            );

            mediaInput.value = "";

            return;
        }

        const name =
            document.createElement("div");

        name.className =
            "preview-name";

        name.textContent =
            file.name;

        preview.appendChild(name);

        const url =
            URL.createObjectURL(file);

        if (file.type.startsWith("video/")) {

            const video =
                document.createElement("video");

            video.src = url;

            video.controls = true;

            video.preload = "metadata";

            preview.appendChild(video);

        } else {

            const image =
                document.createElement("img");

            image.src = url;

            image.alt = "Preview";

            preview.appendChild(image);
        }

        const remove =
            document.createElement("button");

        remove.type = "button";

        remove.className =
            "delete-btn";

        remove.textContent =
            "× Прибрати файл";

        remove.addEventListener(
            "click",
            function () {

                mediaInput.value = "";

                preview.innerHTML = "";

                preview.style.display = "none";

                URL.revokeObjectURL(url);
            }
        );

        preview.appendChild(remove);

        preview.style.display = "block";
    }
);


/* =========================
   LOAD POSTS
========================= */

async function loadPosts() {

    postsContainer.innerHTML =
        '<div class="loading">ЗАВАНТАЖЕННЯ...</div>';

    const result =
        await supabaseClient
            .from("posts")
            .select("*")
            .order("created_at", {
                ascending: false
            });

    const data =
        result.data;

    const error =
        result.error;

    if (error) {

        console.error(
            "LOAD POSTS ERROR:",
            error
        );

        postsContainer.innerHTML =
            '<div class="empty">Не вдалося завантажити сплетні 😭</div>';

        return;
    }

    postsContainer.innerHTML = "";

    if (!data || data.length === 0) {

        postsContainer.innerHTML =
            '<div class="empty">Тут поки тихо...</div>';

        return;
    }

    data.forEach(function(post) {

        const element =
            renderPost(post);

        postsContainer.appendChild(element);

    });
}


/* =========================
   RENDER POST
========================= */

function renderPost(post) {

    const article =
        document.createElement("article");

    article.className =
        "post";


    /* HEADER */

    const header =
        document.createElement("div");

    header.className =
        "post-header";


    const nickname =
        document.createElement("div");

    nickname.className =
        "nickname";

    nickname.textContent =
        post.nickname;


    const date =
        document.createElement("div");

    date.className =
        "date";

    date.textContent =
        formatDate(
            post.created_at
        );


    header.appendChild(nickname);

    header.appendChild(date);

    article.appendChild(header);


    /* MESSAGE */

    const message =
        document.createElement("div");

    message.className =
        "message";

    message.textContent =
        post.message;

    article.appendChild(message);


    /* MEDIA */

    if (post.media_url) {

        const media =
            document.createElement("div");

        media.className =
            "media";


        if (
            post.media_type &&
            post.media_type.startsWith("video/")
        ) {

            const video =
                document.createElement("video");

            video.src =
                post.media_url;

            video.controls = true;

            video.preload = "metadata";

            media.appendChild(video);

        } else {

            const image =
                document.createElement("img");

            image.src =
                post.media_url;

            image.alt =
                "Медіа";

            image.loading =
                "lazy";

            media.appendChild(image);
        }

        article.appendChild(media);
    }


    /* DELETE */

    const deleteBtn =
        document.createElement("button");

    deleteBtn.className =
        "delete-btn";

    deleteBtn.textContent =
        "🗑 НАХ!";


    deleteBtn.addEventListener(
        "click",
        async function(event) {

            event.stopPropagation();

            await deletePost(post);
        }
    );


    article.appendChild(deleteBtn);


    /* GLOW */

    article.addEventListener(
        "click",
        function() {

            article.classList.remove(
                "flash"
            );

            void article.offsetWidth;

            article.classList.add(
                "flash"
            );
        }
    );


    return article;
}


/* =========================
   DATE
========================= */

function formatDate(dateString) {

    const date =
        new Date(dateString);

    return date.toLocaleString(
        "uk-UA",
        {
            day: "2-digit",

            month: "2-digit",

            year: "numeric",

            hour: "2-digit",

            minute: "2-digit"
        }
    );
}


/* =========================
   UPLOAD MEDIA
========================= */

async function uploadMedia(file) {

    const extension =
        file.name
            .split(".")
            .pop()
            .toLowerCase();


    const fileName =
        Date.now()
        + "-"
        + crypto.randomUUID()
        + "."
        + extension;


    const filePath =
        "posts/" + fileName;


    const uploadResult =
        await supabaseClient
            .storage
            .from("forum-media")
            .upload(
                filePath,
                file,
                {
                    cacheControl: "3600",

                    upsert: false,

                    contentType: file.type
                }
            );


    if (uploadResult.error) {

        console.error(
            "UPLOAD ERROR:",
            uploadResult.error
        );

        throw new Error(
            uploadResult.error.message
        );
    }


    const publicResult =
        supabaseClient
            .storage
            .from("forum-media")
            .getPublicUrl(
                filePath
            );


    return {
        url:
            publicResult.data.publicUrl,

        path:
            filePath
    };
}


/* =========================
   CREATE POST
========================= */

async function publishPost() {

    const nickname =
        nicknameInput.value.trim();

    const message =
        messageInput.value.trim();

    const file =
        mediaInput.files[0];


    /* NICKNAME */

    if (
        nickname.length < 1 ||
        nickname.length > 40
    ) {

        showStatus(
            "Нік має містити від 1 до 40 символів.",
            true
        );

        nicknameInput.focus();

        return;
    }


    /* MESSAGE */

    if (message.length < 1) {

        showStatus(
            "Ну шо, розказуй.",
            true
        );

        messageInput.focus();

        return;
    }


    if (message.length > 5000) {

        showStatus(
            "Максимум 5000 символів.",
            true
        );

        return;
    }


    submitBtn.disabled = true;


    let uploadedFile = null;


    try {

        /* UPLOAD */

        if (file) {

            showStatus(
                "Грузіт медіа..."
            );

            uploadedFile =
                await uploadMedia(file);
        }


        /* DATABASE */

        showStatus(
            "Публікую..."
        );


        const insertResult =
            await supabaseClient
                .from("posts")
                .insert({
                    nickname:
                        nickname,

                    message:
                        message,

                    media_url:
                        uploadedFile
                            ? uploadedFile.url
                            : null,

                    media_type:
                        file
                            ? file.type
                            : null
                });


        if (insertResult.error) {

            console.error(
                "POST ERROR:",
                insertResult.error
            );


            /* Якщо файл завантажився,
               але пост не створився */

            if (uploadedFile) {

                await supabaseClient
                    .storage
                    .from("forum-media")
                    .remove([
                        uploadedFile.path
                    ]);
            }


            throw new Error(
                insertResult.error.message
            );
        }


        /* CLEAR */

        nicknameInput.value = "";

        messageInput.value = "";

        mediaInput.value = "";

        preview.innerHTML = "";

        preview.style.display = "none";


        showStatus(
            "Опубліковано 🩸"
        );


        await loadPosts();

    }

    catch (error) {

        console.error(
            "CREATE POST ERROR:",
            error
        );

        showStatus(
            "Ашибка: " +
            error.message,
            true
        );

    }

    finally {

        submitBtn.disabled = false;
    }
}


/* =========================
   DELETE POST
========================= */

async function deletePost(post) {

    const confirmed =
        confirm(
            "Унічтожить цей пост?"
        );


    if (!confirmed) {
        return;
    }


    try {

        /* DELETE MEDIA */

        if (post.media_url) {

            const marker =
                "/forum-media/";


            const index =
                post.media_url.indexOf(
                    marker
                );


            if (index !== -1) {

                const filePath =
                    post.media_url.substring(
                        index + marker.length
                    );


                const result =
                    await supabaseClient
                        .storage
                        .from("forum-media")
                        .remove([
                            filePath
                        ]);


                if (result.error) {

                    console.warn(
                        "MEDIA DELETE ERROR:",
                        result.error
                    );
                }
            }
        }


        /* DELETE POST */

        const result =
            await supabaseClient
                .from("posts")
                .delete()
                .eq(
                    "id",
                    post.id
                );


        if (result.error) {

            throw result.error;
        }


        await loadPosts();

    }

    catch (error) {

        console.error(
            "DELETE ERROR:",
            error
        );

        alert(
            "Нє палучілось видалити пост: "
            + error.message
        );
    }
}


/* =========================
   BUTTON
========================= */

submitBtn.addEventListener(
    "click",
    publishPost
);


/* =========================
   TITLE
========================= */

title.addEventListener(
    "click",
    function() {

        title.style.textShadow =
            `
            0 0 5px white,
            0 0 20px red,
            0 0 40px red,
            0 0 80px red
            `;


        setTimeout(
            function() {

                title.style.textShadow =
                    "";

            },
            500
        );
    }
);


/* =========================
   START
========================= */

loadPosts();

</script>

</body>
</html>
