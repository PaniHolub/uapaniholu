<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ШАНСОН</title>
    
    <link rel="icon" type="image/png" href="images/favico.png">



<style>
    * {
        box-sizing: border-box;
        cursor: url("./images/cursorPUKA.png") 5 5, auto;
    }

    body {
        background: #080303;
        color: #ffb09a;
        font-family: monospace;
        text-align: center;
        margin: 0;
        padding: 30px;
    }

    h1 {
        color: #ff5533;
        text-shadow:
            0 0 5px #ff3311,
            0 0 20px #ff2200,
            0 0 35px #ff6600;
    }

    .music-line {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 25px;
        margin: 20px 0;
    }

    .music-line p {
        margin: 0;
        text-align: center;
        color: #ff9866;
    }

    .music-line img {
        width: 130px;
        height: 130px;
        object-fit: contain;
    }

    /* ПЛЕЙЛИСТ І КОМЕНТАРІ */

    .playlist,
    .bottom-box {
        position: relative;
        isolation: isolate;
        width: 700px;
        max-width: 100%;
        margin: 30px auto;
        padding: 10px;
        background: #080303;
        border: 1px solid #ff4422;
        box-shadow:
            0 0 12px #ff220066,
            0 0 28px #ff330044,
            inset 0 0 25px #260700;
    }

    .playlist {
        height: 450px;
        overflow-y: auto;
    }

    /* ВОГНЯНА РАМКА З ЧОТИРЬОХ СТОРІН */

    .playlist::before,
    
/* ВОГНЯНА РАМКА ТІЛЬКИ ДЛЯ КОМЕНТАРІВ */

.bottom-box::before {
    content: "";
    position: absolute;
    z-index: 2;
    inset: -22px;
    padding: 22px;
    pointer-events: none;

    background:
        url("./gif/firex.gif") top left / auto 22px repeat-x,
        url("./gif/firex.gif") bottom left / auto 22px repeat-x,
        url("./gif/firex.gif") top left / 22px auto repeat-y,
        url("./gif/firex.gif") top right / 22px auto repeat-y;

    background-repeat:
        repeat-x,
        repeat-x,
        repeat-y,
        repeat-y;

    mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

    mask-composite: exclude;
}

/* БОКОВЕ ПОЛУМ'Я: НИЖНІМ КРАЄМ ДО РАМКИ */

.bottom-box::before {
    background:
        url("./gif/firex.gif") top left / auto 22px repeat-x,
        url("./gif/firex.gif") bottom left / auto 22px repeat-x,
        url("./gif/firex.gif") bottom left / 22px auto repeat-y,
        url("./gif/firex.gif") bottom right / 22px auto repeat-y;

    background-repeat:
        repeat-x,
        repeat-x,
        repeat-y,
        repeat-y;
}


    /* ПОСИЛАННЯ НА ГОЛОВНУ */

    .back {
        display: inline-block;
        margin-bottom: 25px;
        color: #ff785c;
        text-decoration: none;
    }

    .back:hover {
        color: #ffffff;
        text-shadow: 0 0 10px #ff3300;
    }

    /* КОМЕНТАРІ */

    #comments h2 {
        color: #ff5533;
        text-shadow:
            0 0 5px #ff3311,
            0 0 15px #ff2200;
    }

    #commentText {
        width: 90%;
        min-height: 80px;
        padding: 10px;
        resize: vertical;
        background: #140705;
        color: #ffb09a;
        border: 1px solid #8f3020;
        font-family: monospace;
    }

    #commentText::placeholder {
        color: #a75a48;
    }

    #comments button {
        margin-top: 10px;
        padding: 8px 20px;
        background: #1a0805;
        color: #ff785c;
        border: 1px solid #ff4422;
        font-family: monospace;
        cursor: pointer;
        transition: 0.2s;
    }

    #comments button:hover {
        color: white;
        background: #3a0c05;
        box-shadow: 0 0 12px #ff3300;
    }

    #commentList {
        margin-top: 20px;
    }

    .comment {
        margin: 10px 0;
        padding: 12px;
        text-align: left;
        background: #140705;
        border: 1px solid #77251b;
        color: #ffb09a;
    }

    /* ПРОКРУТКА ПЛЕЙЛИСТА */

    .playlist::-webkit-scrollbar {
        width: 8px;
    }

    .playlist::-webkit-scrollbar-track {
        background: #100503;
    }

    .playlist::-webkit-scrollbar-thumb {
        background: #a82b18;
        border-radius: 4px;
    }

    .playlist::-webkit-scrollbar-thumb:hover {
        background: #ff5533;
    }

    /* АДАПТАЦІЯ ДЛЯ ТЕЛЕФОНІВ */

    @media (max-width: 600px) {
        body {
            padding: 20px 12px;
        }

        .music-line {
            gap: 10px;
        }

        .music-line img {
            width: 75px;
            height: 75px;
        }

        .music-line p {
            font-size: 12px;
        }

        .playlist,
        .bottom-box {
            max-width: 100%;
        }
    }
</style>


</head>


<body>

<!-- ОКРЕМИЙ КВАДРАТ ДЛЯ ПОСИЛАННЯ І КОМЕНТАРІВ -->

<div class="bottom-box">

    <a href="index.html" class="back">
        ← назад на головну
    </a>

    <div id="comments">

        <h2>♡ КОМЕНТАРІ ♡</h2>

        <textarea
            id="commentText"
            placeholder="Напиши щось..."
        ></textarea>

        <br>

        <button onclick="addComment()">
            Відправити
        </button>

        <div id="commentList"></div>

    </div>

</div>


<script>

const SUPABASE_URL = "https://sijjjlnhfmbmvswphxhz.supabase.co";

const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpampqbG5oZm1ibXZzd3BoeGh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNDk2OTEsImV4cCI6MjEwMjYyNTY5MX0.eyU6n6C6iA8Lxhmj_qktcAbAvfm5cvbm-_3_EoO4RPI";


async function loadComments() {

    const response = await fetch(
        `${SUPABASE_URL}/rest/v1/comments?select=*&order=created_at.desc`,
        {
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${SUPABASE_KEY}`
            }
        }
    );

    const comments = await response.json();

    const list = document.getElementById("commentList");

    list.innerHTML = "";

    comments.forEach(comment => {

        const div = document.createElement("div");

        div.className = "comment";

        div.textContent = comment.comment;

        list.appendChild(div);

    });
}


async function addComment() {

    const text = document
        .getElementById("commentText")
        .value
        .trim();

    if (!text) return;

    await fetch(
        `${SUPABASE_URL}/rest/v1/comments`,
        {
            method: "POST",

            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${SUPABASE_KEY}`,
                "Content-Type": "application/json",
                "Prefer": "return=minimal"
            },

            body: JSON.stringify({
                comment: text
            })
        }
    );

    document.getElementById("commentText").value = "";

    loadComments();
}


loadComments();

</script>

</html>
