<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ШАНСОН</title>
    
    <link rel="icon" type="image/png" href="images/favico.png">


<style>
    * {
        box-sizing: border-box;
        cursor: url("./images/cursorPUKA.png") 5 5, auto;
    }

    body {
        background: #080303;
        color: #ffb09a;
        font-family: monospace;
        text-align: center;
        margin: 0;
        padding: 30px;
    }

    h1 {
        color: #ff5533;
        text-shadow:
            0 0 5px #ff3311,
            0 0 20px #ff2200,
            0 0 35px #ff6600;
    }

    .music-line {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 25px;
        margin: 20px 0;
    }

    .music-line p {
        margin: 0;
        text-align: center;
        color: #ff9866;
    }

    .music-line img {
        width: 130px;
        height: 130px;
        object-fit: contain;
    }

    /* ПЛЕЙЛИСТ З ВОГНЯНОЮ РАМКОЮ */

   
/* КОНТЕЙНЕРИ ВОГНЯНОЇ РАМКИ */

.fire-frame {
    position: relative;
    isolation: isolate;
    width: 700px;
    max-width: 90%;
    margin: 40px auto;
}

/* Самі прямокутники */

.fire-frame .playlist,
.fire-frame .bottom-box {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 100%;
    margin: 0;
    border: 1px solid #ff4828;
    background: #080303;
    box-shadow:
        0 0 12px #ff220066,
        inset 0 0 25px #260700;
}

/* ЧОТИРИ СТОРОНИ ВОГНЮ */

.fire-edge {
    position: absolute;
    z-index: 2;
    pointer-events: none;
    background-image: url("./gif/firex.gif");
    background-repeat: repeat;
    filter: saturate(1.3);
}

/* Верх */

.fire-top {
    left: -12px;
    right: -12px;
    top: -24px;
    height: 28px;
    background-size: auto 100%;
    background-repeat: repeat-x;
}

/* Низ */

.fire-bottom {
    left: -12px;
    right: -12px;
    bottom: -24px;
    height: 28px;
    background-size: auto 100%;
    background-repeat: repeat-x;
    transform: rotate(180deg);
}

/* Ліва та права сторони */

.fire-left,
.fire-right {
    top: -12px;
    bottom: -12px;
    width: 28px;
    background-size: 100% auto;
    background-repeat: repeat-y;
}

.fire-left {
    left: -24px;
}

.fire-right {
    right: -24px;
    transform: scaleX(-1);
}


    /* ПОСИЛАННЯ НА ГОЛОВНУ */

    .back {
        display: inline-block;
        margin-bottom: 25px;
        color: #ff785c;
        text-decoration: none;
    }

    .back:hover {
        color: #ffffff;
        text-shadow: 0 0 10px #ff3300;
    }

    /* КОМЕНТАРІ */

    #comments h2 {
        color: #ff5533;
        text-shadow:
            0 0 5px #ff3311,
            0 0 15px #ff2200;
    }

    #commentText {
        width: 90%;
        min-height: 80px;
        padding: 10px;
        resize: vertical;
        background: #140705;
        color: #ffb09a;
        border: 1px solid #8f3020;
        font-family: monospace;
    }

    #commentText::placeholder {
        color: #a75a48;
    }

    #comments button {
        margin-top: 10px;
        padding: 8px 20px;
        background: #1a0805;
        color: #ff785c;
        border: 1px solid #ff4422;
        font-family: monospace;
        cursor: pointer;
        transition: 0.2s;
    }

    #comments button:hover {
        color: white;
        background: #3a0c05;
        box-shadow: 0 0 12px #ff3300;
    }

    #commentList {
        margin-top: 20px;
    }

    .comment {
        margin: 10px 0;
        padding: 12px;
        text-align: left;
        background: #140705;
        border: 1px solid #77251b;
        color: #ffb09a;
    }

    /* ПРОКРУТКА ПЛЕЙЛИСТА */

    .playlist::-webkit-scrollbar {
        width: 8px;
    }

    .playlist::-webkit-scrollbar-track {
        background: #100503;
    }

    .playlist::-webkit-scrollbar-thumb {
        background: #a82b18;
        border-radius: 4px;
    }

    .playlist::-webkit-scrollbar-thumb:hover {
        background: #ff5533;
    }

    /* АДАПТАЦІЯ ДЛЯ ТЕЛЕФОНІВ */

    @media (max-width: 600px) {
        body {
            padding: 20px 12px;
        }

        .music-line {
            gap: 10px;
        }

        .music-line img {
            width: 75px;
            height: 75px;
        }

        .music-line p {
            font-size: 12px;
        }

        .playlist,
        .bottom-box {
            max-width: calc(100% - 24px);
        }
    }
</style>

</head>


<body>

<!-- ОКРЕМИЙ КВАДРАТ ДЛЯ ПОСИЛАННЯ І КОМЕНТАРІВ -->

<div class="bottom-box">

    <a href="index.html" class="back">
        ← назад на головну
    </a>

    <div id="comments">

        <h2>♡ КОМЕНТАРІ ♡</h2>

        <textarea
            id="commentText"
            placeholder="Напиши щось..."
        ></textarea>

        <br>

        <button onclick="addComment()">
            Відправити
        </button>

        <div id="commentList"></div>

    </div>

</div>


<script>

const SUPABASE_URL = "https://sijjjlnhfmbmvswphxhz.supabase.co";

const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpampqbG5oZm1ibXZzd3BoeGh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNDk2OTEsImV4cCI6MjEwMjYyNTY5MX0.eyU6n6C6iA8Lxhmj_qktcAbAvfm5cvbm-_3_EoO4RPI";


async function loadComments() {

    const response = await fetch(
        `${SUPABASE_URL}/rest/v1/comments?select=*&order=created_at.desc`,
        {
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${SUPABASE_KEY}`
            }
        }
    );

    const comments = await response.json();

    const list = document.getElementById("commentList");

    list.innerHTML = "";

    comments.forEach(comment => {

        const div = document.createElement("div");

        div.className = "comment";

        div.textContent = comment.comment;

        list.appendChild(div);

    });
}


async function addComment() {

    const text = document
        .getElementById("commentText")
        .value
        .trim();

    if (!text) return;

    await fetch(
        `${SUPABASE_URL}/rest/v1/comments`,
        {
            method: "POST",

            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${SUPABASE_KEY}`,
                "Content-Type": "application/json",
                "Prefer": "return=minimal"
            },

            body: JSON.stringify({
                comment: text
            })
        }
    );

    document.getElementById("commentText").value = "";

    loadComments();
}


loadComments();

</script>

</body>
</html>
