<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ШАНСОН</title>
    
    <link rel="icon" type="image/png" href="images/favico.png">

<style>
    * {
    box-sizing: border-box;
    cursor: url("./images/cursorPUKA.png") 5 5, auto;

        /* твій існуючий CSS тут */

        .music-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        .music-line p {
            margin: 0;
            text-align: center;
        }

        .music-line img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

body {
    background: #080008;
    color: #d8a7ff;
    font-family: monospace;
    text-align: center;
    margin: 0;
    padding: 30px;
}

h1 {
    color: #c15cff;
    text-shadow:
        0 0 5px #b84cff,
        0 0 20px #8b00ff;
}

.playlist {
    width: 700px;
    max-width: 90%;
    height: 450px;
    margin: 30px auto;
    padding: 10px;

    overflow-y: auto;

    border: 1px solid #8b2fc9;
    background: #080008;

    box-shadow:
        0 0 20px #6d2094,
        inset 0 0 25px #180020;
}

.track {
    padding: 18px;
    margin-bottom: 10px;

    border: 1px solid #4d176b;
    background: #100016;
}

.track-name {
    display: block;
    margin-bottom: 10px;

    color: #ff7de9;
    text-align: left;
}

.track audio {
    width: 100%;
}


/* НИЖНІЙ КВАДРАТ */

.bottom-box {
    width: 700px;
    max-width: 90%;
    margin: 30px auto 0;
    padding: 25px;

    border: 1px solid #8b2fc9;
    background: #080008;

    box-shadow:
        0 0 20px #6d2094,
        inset 0 0 25px #180020;
}


/* ПОСИЛАННЯ НА ГОЛОВНУ */

.back {
    display: inline-block;
    margin-bottom: 25px;

    color: #ff7de9;
    text-decoration: none;
}

.back:hover {
    color: white;
}


/* КОМЕНТАРІ */

#comments h2 {
    color: #c15cff;

    text-shadow:
        0 0 5px #b84cff,
        0 0 15px #8b00ff;
}

#commentText {
    width: 90%;
    min-height: 80px;

    padding: 10px;

    resize: vertical;

    background: #100016;
    color: #d8a7ff;

    border: 1px solid #4d176b;

    font-family: monospace;
}

#commentText::placeholder {
    color: #7d588c;
}

#comments button {
    margin-top: 10px;
    padding: 8px 20px;

    background: #100016;
    color: #ff7de9;

    border: 1px solid #8b2fc9;

    font-family: monospace;
    cursor: pointer;
}

#comments button:hover {
    color: white;
    box-shadow: 0 0 10px #8b00ff;
}

#commentList {
    margin-top: 20px;
}

.comment {
    margin: 10px 0;
    padding: 12px;

    text-align: left;

    background: #100016;
    border: 1px solid #4d176b;

    color: #d8a7ff;
}

</style>
</head>


<body>

<h1>♡ БЛЕКУХА ♡</h1>

    <p>♫ зара слухаю таку імбу, прям блека́ч уффф ♫</p>

    <img src="gif/girl4.gif" alt="">

</div>


<div class="playlist">

    <div class="track">
        <span class="track-name">04. My Cat Jack Off Jill</span>

        <audio controls>

    <div class="track">
        <span class="track-name">09. ЗЕ ЕНД...</span>
    </div>

</div>


<!-- ОКРЕМИЙ КВАДРАТ ДЛЯ ПОСИЛАННЯ І КОМЕНТАРІВ -->

<div class="bottom-box">

    <a href="index.html" class="back">
        ← назад на головну
    </a>

    <div id="comments">

        <h2>♡ КОМЕНТАРІ ♡</h2>

        <textarea
            id="commentText"
            placeholder="Напиши щось..."
        ></textarea>

        <br>

        <button onclick="addComment()">
            Відправити
        </button>

        <div id="commentList"></div>

    </div>

</div>


<script>

const SUPABASE_URL = "https://sijjjlnhfmbmvswphxhz.supabase.co";

const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpampqbG5oZm1ibXZzd3BoeGh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNDk2OTEsImV4cCI6MjEwMjYyNTY5MX0.eyU6n6C6iA8Lxhmj_qktcAbAvfm5cvbm-_3_EoO4RPI";


async function loadComments() {

    const response = await fetch(
        `${SUPABASE_URL}/rest/v1/comments?select=*&order=created_at.desc`,
        {
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${SUPABASE_KEY}`
            }
        }
    );

    const comments = await response.json();

    const list = document.getElementById("commentList");

    list.innerHTML = "";

    comments.forEach(comment => {

        const div = document.createElement("div");

        div.className = "comment";

        div.textContent = comment.comment;

        list.appendChild(div);

    });
}


async function addComment() {

    const text = document
        .getElementById("commentText")
        .value
        .trim();

    if (!text) return;

    await fetch(
        `${SUPABASE_URL}/rest/v1/comments`,
        {
            method: "POST",

            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${SUPABASE_KEY}`,
                "Content-Type": "application/json",
                "Prefer": "return=minimal"
            },

            body: JSON.stringify({
                comment: text
            })
        }
    );

    document.getElementById("commentText").value = "";

    loadComments();
}


loadComments();

</script>

</body>
</html>
